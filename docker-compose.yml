services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-dashboard-telegram-bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - DB_PATH=/data/dashboard.db
      - LOG_PATH=/var/log/telegram_bot.log
    volumes:
      - ./data:/data
      - ./logs:/var/log
      - ./meal_plan.json:/app/meal_plan.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/data/dashboard.db')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MQTT broker ─────────────────────────────────────────────────────────
  # Included for convenience if you don't already run a broker.
  # If you have your own (e.g. the Mosquitto add-on bundled with Home
  # Assistant), comment this whole block out and point MQTT_BROKER in .env,
  # SERIAL/presence_config.env and VITE_MQTT_BROKER_WS in dashboard/.env at
  # your existing broker instead.
  #
  # mqtt:
  #   image: eclipse-mosquitto:latest
  #   container_name: mosquitto
  #   restart: unless-stopped
  #   ports:
  #     - "1883:1883"
  #     - "9001:9001"
  #   volumes:
  #     - ./mosquitto/config:/mosquitto/config
  #     - ./mosquitto/data:/mosquitto/data
  #     - ./mosquitto/log:/mosquitto/log
  #   networks:
  #     - home-automation
  #   environment:
  #     - TZ=UTC
  # ────────────────────────────────────────────────────────────────────────

  dashboard-web:
    image: nginx:alpine
    container_name: family-dashboard-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dashboard/build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - home-automation
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  home-automation:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
