# ==================== DASHBOARD POWER MANAGEMENT ====================

- id: 'dashboard_turn_on'
  alias: "Dashboard: Turn On (Presence Detected)"
  trigger:
    platform: mqtt
    topic: "home/presence/kitchen/distance"
  condition:
    - condition: template
      value_template: "{{ (trigger.payload | int(0)) < 30 and (trigger.payload | int(0)) > 0 }}"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.kitchen_monitor_plug  # Update to your smart plug
      continue_on_error: true

- id: 'dashboard_turn_off'
  alias: "Dashboard: Turn Off (No Presence)"
  trigger:
    platform: mqtt
    topic: "home/presence/kitchen/distance"
  condition:
    - condition: template
      value_template: "{{ (trigger.payload | int(0)) == 0 or (trigger.payload | int(0)) > 150 }}"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.kitchen_monitor_plug
      continue_on_error: true

# ==================== DASHBOARD DATA PUBLISHING ====================

# NOTE: There are intentionally NO automations here publishing to
# home/dashboard/shopping_list, home/dashboard/calendar_events, or
# home/dashboard/meal_plan. telegram_bot.py publishes changes to these topics immediately via the
# long-lived MQTT client, sourced from the bot's own SQLite database.
# That is the single source of truth for all dashboard-facing topics.
#
# An earlier version of this file had separate time_interval automations
# publishing home/dashboard/shopping_list from shopping_list.shopping_list
# and home/dashboard/calendar_events from calendar.family_events. Those
# were removed: they read from a *different* data source than the bot
# (HA's own entities vs. the bot's SQLite tables), so the two publishers
# periodically raced and overwrote each other on the same topics - the
# shopping list version even used a different payload shape ({name,
# complete, id} objects instead of the plain strings the bot sends and
# dashboard.jsx expects), which could crash the dashboard's rendering
# when HA's write won the race.
#
# Don't add a publisher back for any of these three topics without also
# removing the bot's publish_dashboard_snapshot() job for that same
# topic - two writers on one topic will always fight.

# ==================== ALEXA APPOINTMENT ANNOUNCEMENTS ====================
# Requires the Alexa Media Player custom integration (via HACS) so that
# notify.alexa_media exists and can speak arbitrary text to target Echos.
#
# Both automations below use the native HA "calendar" trigger with a
# time offset, which fires automatically against calendar.telegram
# without any polling logic. Two caveats from HA's own docs, worth
# knowing before you rely on this:
#   1. Calendars are only re-read every ~15 minutes, so the actual
#      announcement can land up to ~15 min off the offset you set.
#   2. mode: queued (not the default "single") is used because the docs
#      explicitly warn that "single" mode can silently miss a trigger if
#      two events start close together.
# Note: the "%-I" in the message templates below strips a leading zero
# from the hour (so "2:00 PM" not "02:00 PM"). This is a Linux/glibc
# strftime extension - it works on virtually all HA installs (HAOS,
# Docker, Supervised all run Linux), but isn't portable to Windows if
# you're running HA Core directly on Windows.
#
# The Telegram bot pushes appointments to calendar.telegram via
# HA's calendar.create_event service (see telegram_bot.py).

- id: 'alexa_appointment_day_before'
  alias: "Alexa: Appointment Reminder (Day Before)"
  mode: queued
  trigger:
    - platform: calendar
      event: start
      entity_id: calendar.telegram
      offset: "-24:00:00"
    - platform: calendar
      event: start
      entity_id: calendar.husband
      offset: "-24:00:00"
    - platform: calendar
      event: start
      entity_id: calendar.wife
      offset: "-24:00:00"
  action:
    - service: notify.alexa_media
      data:
        entity_id:
          - media_player.echo_dot_back_room
          - media_player.echo_dot_front_room
          - media_player.echo_pop_hallway
        message: >
          {% set event = trigger.calendar_event if trigger.calendar_event is defined else none %}
          {% if event %}
          Reminder: you have "{{ event.summary }}" tomorrow
          at {{ event.start.strftime('%-I:%M %p') }}.
          {% else %}
          Reminder: you have an appointment tomorrow.
          {% endif %}
        data:
          type: announce

- id: 'alexa_appointment_hour_before'
  alias: "Alexa: Appointment Reminder (1 Hour Before)"
  mode: queued
  trigger:
    - platform: calendar
      event: start
      entity_id: calendar.telegram
      offset: "-01:00:00"
    - platform: calendar
      event: start
      entity_id: calendar.husband
      offset: "-01:00:00"
    - platform: calendar
      event: start
      entity_id: calendar.wife
      offset: "-01:00:00"
  action:
    - service: notify.alexa_media
      data:
        entity_id:
          - media_player.echo_dot_back_room
          - media_player.echo_dot_front_room
          - media_player.echo_pop_hallway
        message: >
          {% set event = trigger.calendar_event if trigger.calendar_event is defined else none %}
          {% if event %}
          Reminder: "{{ event.summary }}" starts in about an hour.
          {% else %}
          Reminder: you have an appointment starting soon.
          {% endif %}
        data:
          type: announce

# ==================== ALEXA NOTES ANNOUNCEMENTS ====================
# Triggered by the telegram_note_posted event fired from telegram_bot.py
# whenever a new sticky note is added via Telegram.

- id: 'alexa_note_announcement'
  alias: "Alexa: New Note Announcement"
  mode: single
  trigger:
    - platform: event
      event_type: telegram_note_posted
  action:
    - service: notify.alexa_media
      data:
        entity_id:
          - media_player.echo_dot_back_room
          - media_player.echo_dot_front_room
          - media_player.echo_pop_hallway
        message: >
          New note from {{ trigger.event.data.sender }}:
          {{ trigger.event.data.message }}
        data:
          type: announce

# ==================== OPTIONAL: PRESENCE-BASED AUTOMATIONS ====================

# Example: Turn on kitchen light when someone approaches dashboard
- id: 'kitchen_light_on'
  alias: "Kitchen Light: Turn On (Presence Near)"
  trigger:
    platform: mqtt
    topic: "home/presence/kitchen/status"
    payload: "near"
  action:
    - service: light.turn_on
      target:
        entity_id: light.kitchen_light  # Update to your light
      data:
        brightness: 200
      continue_on_error: true

# ==================== PRAYER TIMES ====================

# Pushes live Adhan timestamps and the Hijri date to the dashboard over MQTT.
# The React UI reads topic `home/dashboard/prayer_times` — the `Hijri` key is
# rendered in the card header, the five prayer keys render as time cards.
# Requires a prayer-times integration exposing these sensors (update the
# entity_ids to match your install):
#   sensor.fajr_begins_time, sensor.zuhr_begins_time, sensor.asr_begins_time,
#   sensor.isha_begins_time, sensor.local_hijri_date (+ sun.sun for Maghrib)
- id: 'dashboard_sync_prayer_times'
  alias: "Dashboard: Sync Prayer Times"
  description: >-
    Pushes live Adhan timestamps and Hijri date directly down to the React
    UI layout layer.
  triggers:
    - at: "00:05:00"
      trigger: time
    - event: start
      trigger: homeassistant
  actions:
    - action: mqtt.publish
      data:
        topic: home/dashboard/prayer_times
        retain: true
        payload: >-
          {"Hijri":"{{ states("sensor.local_hijri_date") }}","Fajr":"{{ as_timestamp(states("sensor.fajr_begins_time"), default=0) |
          timestamp_custom("%I:%M %p", true, "12:00 AM") }}","Dhuhr":"{{
          as_timestamp(states("sensor.zuhr_begins_time"), default=0) |
          timestamp_custom("%I:%M %p", true, "12:00 AM") }}","Asr":"{{
          as_timestamp(states("sensor.asr_begins_time"), default=0) |
          timestamp_custom("%I:%M %p", true, "12:00 AM") }}","Maghrib":"{{
          as_timestamp(state_attr("sun.sun", "next_setting"), default=0) |
          timestamp_custom("%I:%M %p", true, "12:00 AM") }}","Isha":"{{
          as_timestamp(states("sensor.isha_begins_time"), default=0) |
          timestamp_custom("%I:%M %p", true, "12:00 AM") }}"}
  mode: single

